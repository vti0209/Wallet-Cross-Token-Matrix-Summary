<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cross-Token Pivot Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --border: #e5eaf2;
      --border-strong: #d5ddea;
      --text: #172033;
      --muted: #64748b;
      --muted-light: #94a3b8;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #059669;
      --success-bg: #ecfdf5;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --info-bg: #eff6ff;
      --radius: 10px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      padding: 28px;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 100%;
      margin: 0 auto;
      padding: 0 8px;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .card {
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.035);
      padding: 20px 24px;
      margin-bottom: 18px;
    }

    .card.no-padding {
      padding: 0;
      overflow: hidden;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2.2fr 1.2fr 1fr 1fr auto;
      gap: 14px;
      align-items: end;
    }

    @media (max-width: 1024px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }

      .form-actions {
        grid-column: span 2;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      .container {
        padding: 0;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-actions {
        grid-column: span 1;
      }
    }

    .form-group label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.55px;
    }

    .form-group input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }

    .form-group input:hover {
      border-color: #bcc7d8;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .form-group input::placeholder {
      color: var(--muted-light);
    }

    .form-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: 8px;
      height: 38px;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, background .15s, border-color .15s;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 1px 2px rgba(37, 99, 235, 0.18);
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      box-shadow: 0 3px 8px rgba(37, 99, 235, 0.18);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border-strong);
    }

    .btn-secondary:hover {
      background: var(--surface-soft);
      border-color: #bcc7d8;
    }

    .status {
      font-size: 12px;
      font-weight: 600;
      margin-top: 14px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
    }

    .status.error {
      color: var(--danger);
      background: var(--danger-bg);
      border-color: #fecaca;
    }

    .status.info {
      color: var(--primary);
      background: var(--info-bg);
      border-color: #bfdbfe;
    }

    .status.success {
      color: var(--success);
      background: var(--success-bg);
      border-color: #a7f3d0;
    }

    .hidden {
      display: none !important;
    }

    .info-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 20px;
      padding: 14px 0 0;
      margin-top: 14px;
      border-top: 1px solid #edf1f6;
      font-size: 11px;
      color: var(--muted);
    }

    .info-bar .info-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .info-bar .info-item strong {
      color: var(--text);
      font-weight: 650;
    }

    .info-bar .info-item .label {
      color: var(--muted-light);
      font-weight: 500;
    }

    .wallet-info {
      min-width: 0;
    }

    .wallet-info strong {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      white-space: nowrap;
      overflow: visible;
    }

    .info-copy {
      font-size: 8px;
      padding: 3px 5px;
      margin-left: 2px;
    }

    .table-wrap {
      overflow: auto;
      border-radius: 14px;
      max-height: 700px;
      position: relative;
    }

    .table-wrap::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    .table-wrap::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    .table-wrap::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 8px;
      border: 2px solid #f1f5f9;
    }

    .table-wrap::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      min-width: 800px;
      font-size: 12px;
    }

    th, td {
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 5px 7px;
      text-align: center;
      vertical-align: middle;
      background: #fff;
    }

    th {
      background: #f8fafc;
      font-weight: 700;
      color: var(--text);
      position: sticky;
      top: 0;
      z-index: 10;
      white-space: nowrap;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 8px 7px;
      border-bottom: 2px solid var(--border-strong);
    }

    th:first-child {
      border-left: 0;
    }

    .matrix-corner {
      min-width: 120px;
      position: sticky;
      left: 0;
      z-index: 15;
      background: #f8fafc;
      border-right: 2px solid var(--border-strong);
    }

    tr:last-child td {
      border-bottom: 0;
    }

    th .th-symbol {
      display: block;
      font-size: 11px;
      font-weight: 700;
    }

    th .th-address-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 2px;
    }

    th .th-address {
      font-weight: 400;
      color: var(--muted);
      text-transform: none;
      font-size: 8px;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted-light);
      cursor: pointer;
      font-size: 7px;
      padding: 2px 3px;
      border-radius: 4px;
      transition: all .15s;
      line-height: 1;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.2px;
    }

    .copy-btn:hover {
      background: #eef4ff;
      border-color: #dbe7ff;
      color: var(--primary);
    }

    .copy-btn.copied {
      color: var(--success);
    }

    .token-cell {
      text-align: left;
      background: #f8fafc;
      font-weight: 700;
      position: sticky;
      left: 0;
      z-index: 5;
      min-width: 120px;
      padding: 5px 9px;
      border-right: 2px solid var(--border-strong);
      font-size: 11px;
    }

    .token-cell .token-name {
      display: block;
      font-weight: 700;
      font-size: 11px;
      color: var(--text);
    }

    .token-cell .address-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .token-cell .addr {
      font-size: 8px;
      color: var(--muted);
      font-weight: 400;
    }

    tbody tr:hover td {
      background: #fbfdff;
    }

    tbody tr:hover .token-cell {
      background: #f4f7fb;
    }

    .cell-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1px 0;
      min-height: 34px;
      gap: 1px;
    }

    .cell-out {
      color: var(--danger);
      font-weight: 700;
      font-size: 10px;
      line-height: 1.4;
    }

    .cell-out.dim {
      color: #cbd5e1;
      opacity: 1;
    }

    .cell-in {
      color: var(--success);
      font-weight: 700;
      font-size: 10px;
      line-height: 1.4;
    }

    .cell-in.dim {
      color: #cbd5e1;
      opacity: 1;
    }

    .empty-cell {
      color: #cbd5e1;
      font-weight: 400;
      font-size: 13px;
      line-height: 1;
      text-align: center;
      padding: 7px 0;
      background: #fcfdff;
    }

    .copy-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: #172033;
      color: #fff;
      padding: 8px 14px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      z-index: 999;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .18);
    }

    .copy-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 640px) {
      .card {
        padding: 14px 16px;
      }

      .header h1 {
        font-size: 20px;
      }

      table {
        font-size: 10px;
        min-width: 600px;
      }

      th, td {
        padding: 4px 5px;
      }

      .token-cell {
        min-width: 80px;
        font-size: 10px;
      }

      .cell-out, .cell-in {
        font-size: 9px;
      }
    }

  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <form id="searchForm" onsubmit="return false;">
      <div class="form-grid">
        <div class="form-group">
          <label>Wallet Address</label>
          <input id="wallet" type="text" placeholder="0x...">
        </div>
        <div class="form-group">
          <label>Chain</label>
          <input id="chain" type="text" placeholder="sol, eth, bsc...">
        </div>
        <div class="form-group">
          <label>From Date</label>
          <input id="from_date" type="date">
        </div>
        <div class="form-group">
          <label>To Date</label>
          <input id="to_date" type="date">
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="searchBtn" type="button">Search</button>
          <button class="btn btn-secondary" id="exportBtn" type="button">CSV</button>
        </div>
      </div>
    </form>

    <div id="statusMessage" class="status hidden"></div>

    <!-- Info Bar -->
    <div id="infoBar" class="info-bar hidden">
      <span class="info-item wallet-info"><span class="label">Wallet:</span> <strong id="infoWallet">-</strong><button class="copy-btn info-copy" id="copyWalletBtn" type="button" title="Copy wallet address">Copy</button></span>
      <span class="info-item"><span class="label">Chain:</span> <strong id="infoChain">-</strong></span>
      <span class="info-item"><span class="label">From:</span> <strong id="infoFrom">-</strong></span>
      <span class="info-item"><span class="label">To:</span> <strong id="infoTo">-</strong></span>
      <span class="info-item"><span class="label">Tokens:</span> <strong id="infoTokens">0</strong></span>
      <span class="info-item"><span class="label">Relations:</span> <strong id="infoRelations">0</strong></span>
    </div>
  </div>

  <div class="card no-padding">
    <div class="table-wrap">
      <table id="matrixTable">
        <thead id="matrixHeader"></thead>
        <tbody id="matrixBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="copyToast" class="copy-toast">Copied!</div>

<script>
const $ = id => document.getElementById(id);
const wallet = $('wallet'), chain = $('chain'), from = $('from_date'), to = $('to_date');
const header = $('matrixHeader'), body = $('matrixBody');
const status = $('statusMessage');
const infoBar = $('infoBar');
const infoWallet = $('infoWallet'), infoChain = $('infoChain');
const infoFrom = $('infoFrom'), infoTo = $('infoTo');
const infoTokens = $('infoTokens'), infoRelations = $('infoRelations');
const searchBtn = $('searchBtn'), exportBtn = $('exportBtn');
const copyWalletBtn = $('copyWalletBtn');
const copyToast = $('copyToast');
let data = null;
let toastTimeout = null;

// Lấy ngày hôm nay
const getToday = () => {
  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, '0');
  const day = String(today.getDate()).padStart(2, '0');
  return year + '-' + month + '-' + day;
};

window.addEventListener('DOMContentLoaded', () => {
  wallet.value = '';
  chain.value = '';
  from.value = '';
  to.value = getToday(); // Mặc định là ngày hôm nay
});

const fmt = (n) => {
  if (n === undefined || n === null) return '0';
  const num = Number(n);
  if (isNaN(num)) return '0';
  if (num === 0) return '0';
  if (Math.abs(num) >= 1) {
    return num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 4 });
  }
  return num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 6 });
};

const truncateAddress = (addr) => {
  if (!addr) return '';
  if (addr === 'NATIVE') return 'NATIVE';
  if (addr.length <= 12) return addr;
  return addr.slice(0, 6) + '...' + addr.slice(-4);
};


const formatDate = (value) => {
  if (!value) return '-';
  const parts = value.split('-');
  if (parts.length !== 3) return value;
  return parts[2] + '/' + parts[1] + '/' + parts[0];
};

const showStatus = (msg, type = 'info') => {
  status.textContent = msg;
  status.className = 'status ' + type;
  status.classList.remove('hidden');
};

const hideStatus = () => status.classList.add('hidden');

const copyToClipboard = (text, event) => {
  if (event) event.stopPropagation();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showCopyToast();
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
};

const fallbackCopy = (text) => {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showCopyToast();
  } catch (e) {
    alert('Copy failed');
  }
  document.body.removeChild(textarea);
};

const showCopyToast = () => {
  copyToast.classList.add('show');
  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    copyToast.classList.remove('show');
  }, 1500);
};

const renderTable = (d, query) => {
  header.innerHTML = '';
  body.innerHTML = '';
  hideStatus();

  if (!d?.tokens?.length) {
    showStatus('Khong tim thay du lieu giao dich cho thong so nay.', 'error');
    return;
  }

  const { tokens, matrix } = d;

  const validRowKeys = new Set(Object.keys(matrix));
  const validRowTokens = tokens.filter(t => validRowKeys.has(t.key));

  if (validRowTokens.length === 0) {
    showStatus('Khong tim thay du lieu giao dich cho thong so nay.', 'error');
    return;
  }

  // HEADER
  const trHead = document.createElement('tr');
  let headerHtml = '<th class="matrix-corner">TOKEN / POOL</th>';
  
  tokens.forEach(t => {
    const addr = t.contract || 'NATIVE';
    const displayAddr = truncateAddress(addr);
    headerHtml += '<th>' +
      '<span class="th-symbol">' + t.symbol + '</span>' +
      '<div class="th-address-wrapper">' +
        '<span class="th-address" title="' + addr + '">' + displayAddr + '</span>' +
        '<button class="copy-btn" onclick="copyToClipboard(\'' + addr + '\', event)" title="Copy address">Copy</button>' +
      '</div>' +
    '</th>';
  });
  
  trHead.innerHTML = headerHtml;
  header.appendChild(trHead);

  // BODY - OUT/IN tren 2 dong
  validRowTokens.forEach(rowToken => {
    const tr = document.createElement('tr');
    const rowKey = rowToken.key;
    const rowAddr = rowToken.contract || 'NATIVE';
    const displayRowAddr = truncateAddress(rowAddr);
    
    let rowHtml = '<td class="token-cell">' +
      '<span class="token-name">' + rowToken.symbol + '</span>' +
      '<div class="address-wrapper">' +
        '<span class="addr" title="' + rowAddr + '">' + displayRowAddr + '</span>' +
        '<button class="copy-btn" onclick="copyToClipboard(\'' + rowAddr + '\', event)" title="Copy address">Copy</button>' +
      '</div>' +
    '</td>';
    
    tokens.forEach(colToken => {
      const colKey = colToken.key;
      const cell = matrix[rowKey]?.[colKey];
      
      if (!cell || !cell.has_relation) {
        rowHtml += '<td class="empty-cell">-</td>';
        return;
      }
      
      const outVal = cell.sent || 0;
      const inVal = cell.received || 0;
      
      let cellHtml = '<div class="cell-content">';
      
      // OUT: dong tren, co dau tru
      if (outVal !== 0) {
        cellHtml += '<span class="cell-out">-' + fmt(Math.abs(outVal)) + '</span>';
      } else {
        cellHtml += '<span class="cell-out dim">-0</span>';
      }
      
      // IN: dong duoi, co dau cong
      if (inVal !== 0) {
        cellHtml += '<span class="cell-in">+' + fmt(inVal) + '</span>';
      } else {
        cellHtml += '<span class="cell-in dim">+0</span>';
      }
      
      cellHtml += '</div>';
      rowHtml += '<td>' + cellHtml + '</td>';
    });
    
    tr.innerHTML = rowHtml;
    body.appendChild(tr);
  });

  // Info Bar
  const totalRelations = Object.values(matrix).reduce((sum, row) => {
    return sum + Object.values(row).filter(c => c.has_relation).length;
  }, 0);
  
  infoWallet.textContent = wallet.value || '-';
  infoChain.textContent = chain.value || 'ALL';
  infoFrom.textContent = formatDate(from.value);
  infoTo.textContent = formatDate(to.value);
  infoTokens.textContent = validRowTokens.length;
  infoRelations.textContent = totalRelations;
  infoBar.classList.remove('hidden');
  
};

const fetchMatrix = async () => {
  const w = wallet.value.trim();
  if (!w) {
    showStatus('Vui long nhap dia chi vi!', 'error');
    return;
  }
  
  searchBtn.disabled = true;
  searchBtn.innerHTML = 'Searching...';
  showStatus('Dang truy van du lieu...', 'info');
  
  try {
    const origin = window.location.protocol === 'file:' ? 'http://127.0.0.1:5000' : window.location.origin;
    const res = await fetch(origin + '/api/pool-token-summary', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        wallet: w,
        chain: chain.value.trim(),
        from_date: from.value,
        to_date: to.value
      })
    });
    
    if (!res.ok) {
      const e = await res.json();
      throw new Error(e.message || 'HTTP ' + res.status);
    }
    
    const result = await res.json();
    if (result.status !== 'success') {
      throw new Error(result.message || 'Loi he thong!');
    }
    
    data = result.data;
    renderTable(data, {
      wallet: w,
      chain: chain.value.trim(),
      from: from.value,
      to: to.value
    });
    
  } catch (e) {
    showStatus(e.message, 'error');
  } finally {
    searchBtn.disabled = false;
    searchBtn.innerHTML = 'Search';
  }
};


copyWalletBtn.onclick = () => {
  copyToClipboard(wallet.value);
};

searchBtn.onclick = fetchMatrix;
document.getElementById('searchForm').onsubmit = (e) => {
  e.preventDefault();
  fetchMatrix();
};

// EXPORT CSV - 2 dong OUT/IN rieng biet
exportBtn.onclick = () => {
  if (!data?.tokens) {
    alert('Khong co du lieu de xuat!');
    return;
  }
  
  const { tokens, matrix } = data;
  const validRowKeys = new Set(Object.keys(matrix));
  const validRowTokens = tokens.filter(t => validRowKeys.has(t.key));
  
  if (validRowTokens.length === 0) {
    alert('Khong co du lieu de xuat!');
    return;
  }
  
  let csv = 'Token';
  tokens.forEach(t => { csv += ',' + t.symbol; });
  csv += '\n';
  
  validRowTokens.forEach(rowToken => {
    let row = rowToken.symbol;
    tokens.forEach(colToken => {
      const cell = matrix[rowToken.key]?.[colToken.key];
      if (!cell || !cell.has_relation) {
        row += ',-';
      } else {
        const sent = cell.sent || 0;
        const received = cell.received || 0;
        // OUT va IN tren 2 dong rieng: -X | +Y
        row += ',' + sent + ' | +' + received;
      }
    });
    csv += row + '\n';
  });
  
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURI(csv);
  a.download = 'matrix_' + wallet.value.slice(0, 12) + '.csv';
  a.click();
};

wallet.onkeydown = (e) => { if (e.key === 'Enter') fetchMatrix(); };
